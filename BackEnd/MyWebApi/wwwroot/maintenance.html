<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>CryptoMatrix | Maintenance</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");

    :root {
      color-scheme: dark;
      --bg-color: #0d0f1a;
      --text-primary: #ffffff;
      --text-secondary: #7f8cff;
      --glass-border: rgba(127, 140, 255, 0.12);
      --brand-accent: #ff7f50;
      --brand-accent-soft: #ffd6b0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(127, 140, 255, 0.16), transparent 28%),
        radial-gradient(circle at 82% 14%, rgba(255, 127, 80, 0.12), transparent 24%),
        var(--bg-color);
      color: var(--text-primary);
      font-family: "Inter", "Segoe UI", sans-serif;
    }

    .section {
      width: min(760px, 100%);
      background: linear-gradient(180deg, rgba(26, 29, 46, 0.96), rgba(17, 19, 31, 0.98));
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.26);
      text-align: center;
    }

    .image {
      width: 100%;
      max-width: 420px;
      border-radius: 18px;
      max-width: 100%;
      display: block;
      margin: 0 auto 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(127, 140, 255, 0.12);
      border: 1px solid rgba(127, 140, 255, 0.2);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    .badge-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--brand-accent);
      box-shadow: 0 0 16px rgba(255, 127, 80, 0.45);
    }

    h1 {
      margin: 18px 0 16px;
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      line-height: 0.98;
      letter-spacing: -0.04em;
      color: var(--text-primary);
    }

    p {
      margin: 0 auto;
      max-width: 52ch;
      color: #c9d0ff;
      line-height: 1.8;
      font-size: 15px;
    }

    .status {
      margin-top: 24px;
      color: var(--brand-accent-soft);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 700;
    }

    @media (max-width: 640px) {
      .section {
        padding: 32px 22px;
      }
    }
  </style>
</head>
<body>
  <section class="section">
    <img
      class="image"
      src="/assets/maintance.jpg"
      alt="Maintenance"
    >

    <div class="badge">
      <span class="badge-dot"></span>
      Scheduled maintenance
    </div>

    <h1>CryptoMatrix is temporarily unavailable.</h1>

    <p>
      We are applying updates to improve platform stability, security, and account
      experience. Please check back shortly.
    </p>

    <div class="status">Maintenance mode active</div>
  </section>
</body>
</html>
