services:
  - type: web
    runtime: static
    name: crypto-inc-eood-front-end
    rootDir: FrontEnd
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE
        value: https://digital-assets-market-d2ua.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    runtime: docker
    name: crypto-inc-eood-back-end
    plan: free
    region: oregon
    rootDir: BackEnd
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: 10000
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: MyWebApi
      - key: Jwt__Audience
        value: MyWebApiUsers
      - key: DATABASE_URL
        fromDatabase:
          name: digital-assets-market-db
          property: connectionString
      - key: Frontend__BaseUrl
        value: https://crypto-inc-eood-front-end.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://crypto-inc-eood-front-end.onrender.com

databases:
  - name: digital-assets-market-db
    plan: free
    region: oregon
    postgresMajorVersion: "18"
    databaseName: digital_assets_market
    user: digital_assets_market_user
    ipAllowList: []
